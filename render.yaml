# Render 部署配置（free 层可跑全栈）
#
# 使用方式（GitHub 自动部署，用户已特批推送 github.com/xunye0206/fitness-ai）：
#   1. Render 控制台 New → Blueprint → 连接 GitHub 仓库 fitness-ai
#   2. Render 自动读取本文件创建 Web Service
#   3. 在 Environment 里填以下 sync:false 变量（不含量密钥，密钥只在 Render 控制台填，不进 git）
#   4. 数据库用 Supabase（已建），Redis 用 Upstash（已建），图片存 Supabase Storage
#
# 安全：本文件不含量密钥，AI key / JWT_SECRET 仅在 Render 控制台 Environment 填写。

services:
  - type: web
    name: fitness-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # 填 Supabase 连接串（把 postgresql:// 改成 postgresql+asyncpg://）
        sync: false
      - key: REDIS_URL             # 填 Upstash / 外部 Redis 连接串（redis://...）
        sync: false
      - key: JWT_SECRET            # 必须改！用强随机串，不能再用本地默认值
        sync: false
      - key: REASONING_PROVIDER
        value: "deepseek"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: VISION_PROVIDER
        value: "qwen"
      - key: QWEN_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: "qwen"
      - key: EMBEDDING_DIM
        value: "1024"
      - key: PROFILE_MEMORY_ENABLED
        value: "true"
      - key: COMPLIANCE_LLM_CHECK
        value: "true"
      - key: SUPABASE_URL           # 填 Supabase 项目 URL（Settings → API → Project URL）
        sync: false
      - key: SUPABASE_KEY           # 填 Supabase service_role key（Settings → API → service_role secret，勿用 anon！）
        sync: false
      - key: SUPABASE_BUCKET        # 填 fitness-uploads（已建为 Public bucket）
        value: "fitness-uploads"
