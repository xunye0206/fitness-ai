# Render 部署配置（free 层可跑全栈）
#
# ⚠️ 红线提醒：本项目约定「git 绝不推送远端」。Render 的 GitHub 自动部署需要推送代码，
#    会打破该红线。如要用 Render 自动部署，需你明确授权破例。
#    不碰 git 的替代方案：在自有服务器 docker build 本目录后运行（见 DEPLOY.md）。
#
# 使用方式（手动部署，不连 GitHub）：
#   1. Render 控制台新建 Web Service → 选 "Deploy an existing image" 或上传镜像
#   2. 或新建 Blueprint → 上传本 render.yaml（需先有代码仓库，即破红线）
#   3. 在 Environment 里填以下变量（sync:false 表示在控制台手动填，不自动同步）
#   4. 单独加 Postgres 实例（free 层有）与 Redis（用 Upstash 免费外部 Redis）

services:
  - type: web
    name: fitness-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # 填 Render Postgres 内部连接串（postgresql+asyncpg://...）
        sync: false
      - key: REDIS_URL             # 填 Upstash / 外部 Redis 连接串（redis://...）
        sync: false
      - key: JWT_SECRET            # 必须改！用强随机串，不能再用本地默认值
        sync: false
      - key: REASONING_PROVIDER
        value: "deepseek"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: VISION_PROVIDER
        value: "qwen"
      - key: QWEN_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: "qwen"
      - key: EMBEDDING_DIM
        value: "1024"
      - key: PROFILE_MEMORY_ENABLED
        value: "true"
      - key: COMPLIANCE_LLM_CHECK
        value: "true"
